spring.application.name=registrar-recepcion-bolsin
server.port=8080

spring.datasource.url=jdbc:h2:mem:bolsinesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Ejecutar data.sql despues de que Hibernate crea las tablas
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CU 29: envío de mails (Servidor de Correo).
# Sin configurar, los mails se simulan y se escriben en el log.
# Para enviarlos de verdad, crear backend/mail-local.properties (ver mail-local.properties.example).
# Ese archivo tiene la contraseña y NO se sube a git.
spring.config.import=optional:file:./mail-local.properties,optional:file:./backend/mail-local.properties
notificaciones.mail.habilitado=false
spring.mail.default-encoding=UTF-8
